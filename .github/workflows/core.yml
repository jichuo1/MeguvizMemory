name: core-and-installed-image
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Release -DMGMEM_BUILD_JNI_HOST_TESTS=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install/host
      - name: Build
        run: cmake --build build/core --config Release --parallel 2
      - name: Core safety verification
        run: ctest --test-dir build/core -C Release --output-on-failure
      - name: Configure pressure attachment race regression
        run: cmake -S tests/pressure_attach_race -B build/pressure-attach-race-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build pressure attachment race regression
        run: cmake --build build/pressure-attach-race-ci --config Release --parallel 2
      - name: Verify pressure attachment race regression
        run: ctest --test-dir build/pressure-attach-race-ci -C Release --output-on-failure
      - name: Multi-arena diagnostic contracts (Linux)
        if: runner.os == 'Linux'
        run: python bench/test_tlb_multi_arena.py --exe build/core/mgmem_tlb_multi_arena --runtime-dir build/core
      - name: Multi-arena diagnostic contracts (Windows)
        if: runner.os == 'Windows'
        run: python bench/test_tlb_multi_arena.py --exe build/core/Release/mgmem_tlb_multi_arena.exe --runtime-dir build/core/Release
      - name: Configure checked C++ adapter contracts
        run: cmake -S tests/cpp_checked -B build/cpp-checked-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build checked C++ adapter contracts
        run: cmake --build build/cpp-checked-ci --config Release --parallel 2
      - name: Verify checked C++ adapter contracts
        run: ctest --test-dir build/cpp-checked-ci -C Release --output-on-failure
      - name: Historical paired archive tests
        run: python tools/test_audit_paired_archive.py
      - name: Historical paired archive audit
        run: python tools/audit_paired_archive.py --output-dir artifacts/ci-research
      - name: Paired analysis offline checks
        run: python tools/test_paired_analysis_v2.py --output artifacts/ci-research/offline-validator.json
      - name: Paired suite offline checks
        run: python tools/test_paired_suite_v2.py --output artifacts/ci-research/four-group-suite.json
      - name: Device capture offline checks
        run: python tools/test_device_capture_v2.py --output artifacts/ci-research/fake-device-capture.json
      - name: Arm64 consumer validation checks
        run: python tools/test_validate_arm64_consumers_v2.py
      - name: Device suite freezing checks
        run: python tools/test_freeze_device_suite_v2.py
      - name: Windows capture journal regression
        if: runner.os == 'Windows'
        run: python tools/test_capture_journal.py --out-dir build/capture-journal-ci
      - name: Packed reader standalone Java contracts
        run: python tools/verify_packed_reader.py --java-only --build-dir build/packed-java-ci --receipt artifacts/ci-packed/receipt.json
      - name: Android pressure Java lifecycle contracts
        run: python tools/verify_android_pressure.py --out-dir build/pressure-java-ci --receipt artifacts/ci-pressure/receipt.json
      - name: Android packaging ABI checks
        run: python tools/test_build_pressure_abi.py
      - name: Android candidate offline safety contracts
        run: python tools/test_build_android_candidate.py
      - name: Host candidate offline safety contracts
        run: python tools/test_build_host_candidate.py
      - name: Android JNI CMake package contracts
        run: python tools/test_android_jni_cmake_config.py
      - name: Feature preview privacy scanner checks
        run: python tools/test_package_feature_preview.py
      - name: Follow-up preview contract checks
        run: python tools/test_package_followup_preview.py
      - name: Android borrow diagnostic protocol checks
        run: python tools/test_android_borrow_round.py
      - name: Managed Android sample AAR structure checks
        run: python consumers/android_managed/tests/test_verify_compile.py
      - name: Configure host JNI borrowing fixture
        run: cmake -S tests/borrow_host -B build/borrow-jni-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build host JNI borrowing fixture
        run: cmake --build build/borrow-jni-ci --config Release --parallel 2
      - name: Verify host JNI borrowing fixture
        run: ctest --test-dir build/borrow-jni-ci -C Release --output-on-failure
      - name: Configure managed domain host contracts
        run: cmake -S tests/managed_host -B build/managed-host-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build managed domain host contracts
        run: cmake --build build/managed-host-ci --config Release --parallel 2
      - name: Verify managed domain host contracts
        run: ctest --test-dir build/managed-host-ci -C Release --output-on-failure
      - name: Verify managed Android sample with host stubs (Linux)
        if: runner.os == 'Linux'
        run: python consumers/android_managed/verify_host.py --fixture-classes build/managed-host-ci/classes --fixture-jni build/managed-host-ci/plain --out-dir build/android-managed-sample-ci
      - name: Verify managed Android sample with host stubs (Windows)
        if: runner.os == 'Windows'
        run: python consumers/android_managed/verify_host.py --fixture-classes build/managed-host-ci/classes --fixture-jni build/managed-host-ci/plain/Release --out-dir build/android-managed-sample-ci
      - name: Configure Android borrow host-only diagnostic
        run: cmake -S tests/android_borrow/host_stub -B build/android-borrow-stub-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build Android borrow host-only diagnostic
        run: cmake --build build/android-borrow-stub-ci --config Release --parallel 2
      - name: Verify Android borrow host-only diagnostic
        run: ctest --test-dir build/android-borrow-stub-ci -C Release --output-on-failure
      - name: Continuation capture validation regressions (offline real fixtures)
        run: python tools/test_continuation_validation.py
      - name: Diagnostic debugger identity and detach regressions
        run: python tools/test_lldb_own_app.py
      - name: Android close receipt atomic publication regressions
        run: python tools/test_android_close_atomic.py
      - name: Windows close receipt real sharing regression
        if: runner.os == 'Windows'
        run: python tools/test_android_close_atomic_windows.py --output artifacts/android-close-investigation-20261030/ci-atomic-windows.json
      - name: Install
        run: cmake --install build/core --config Release
      - name: Verify installed Java image consumer
        run: python consumers/java_image/run_host_ci.py --memory-sdk install/host --out-dir build/java-image-ci
      - name: Configure installed consumer
        run: cmake -S consumers/image -B build/image -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install/host -DMGMEM_IMAGE_BUILD_TRACE=ON -DMGMEM_IMAGE_BUILD_TRACE_TESTS=ON
      - name: Build installed consumer
        run: cmake --build build/image --config Release --parallel 2
      - name: Verify image trace SHA-256 vectors (Linux)
        if: runner.os == 'Linux'
        run: build/image/mgmem_image_trace_sha256
      - name: Verify image trace SHA-256 vectors (Windows)
        if: runner.os == 'Windows'
        run: build/image/Release/mgmem_image_trace_sha256.exe
      - name: Verify image trace capture (Linux)
        if: runner.os == 'Linux'
        run: python consumers/image/test_trace_capture.py --plain-exe build/image/mgmem_image_paired --trace-exe build/image/mgmem_image_trace --fault-exe build/image/mgmem_image_trace_fault --runtime-dir install/host/lib --out-dir build/image-trace-ci
      - name: Verify image trace capture (Windows)
        if: runner.os == 'Windows'
        run: python consumers/image/test_trace_capture.py --plain-exe build/image/Release/mgmem_image_paired.exe --trace-exe build/image/Release/mgmem_image_trace.exe --fault-exe build/image/Release/mgmem_image_trace_fault.exe --runtime-dir install/host/bin --out-dir build/image-trace-ci
      - name: Verify image trace replay (Linux)
        if: runner.os == 'Linux'
        run: python consumers/image/test_trace_replay.py --trace-exe build/image/mgmem_image_trace --core install/host/lib/libmgmem.so --runtime-dir install/host/lib --out-dir build/image-trace-replay-ci
      - name: Verify image trace replay (Windows)
        if: runner.os == 'Windows'
        run: python consumers/image/test_trace_replay.py --trace-exe build/image/Release/mgmem_image_trace.exe --core install/host/bin/mgmem.dll --runtime-dir install/host/bin --out-dir build/image-trace-replay-ci
      - name: Verify image outputs (Linux)
        if: runner.os == 'Linux'
        run: LD_LIBRARY_PATH=$PWD/install/host/lib python3 tools/verify_consumers.py --image-only --image-exe build/image/mgmem_image --out-dir artifacts/ci-image
      - name: Verify image outputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$pwd/install/host/bin;" + $env:PATH
          python tools/verify_consumers.py --image-only --image-exe build/image/Release/mgmem_image.exe --out-dir artifacts/ci-image
      - name: Verify persistent image workspaces (Linux)
        if: runner.os == 'Linux'
        run: LD_LIBRARY_PATH=$PWD/install/host/lib python3 tools/verify_image_workspace_v2.py --image-exe build/image/mgmem_image_paired --out-dir build/image-v2-fixtures --receipt artifacts/ci-image-v2/receipt.json
      - name: Verify persistent image workspaces (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/verify_image_workspace_v2.py --image-exe build/image/Release/mgmem_image_paired.exe --runtime-dir install/host/bin --out-dir build/image-v2-fixtures --receipt artifacts/ci-image-v2/receipt.json
      - name: Verify image timing harness (Linux)
        if: runner.os == 'Linux'
        run: LD_LIBRARY_PATH=$PWD/install/host/lib python3 tools/verify_image_perf_v2.py --exe build/image/mgmem_image_perf --out-dir build/image-perf-v2-fixtures --receipt artifacts/ci-image-v2/perf-functional.json
      - name: Verify image timing harness (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/verify_image_perf_v2.py --exe build/image/Release/mgmem_image_perf.exe --runtime-dir install/host/bin --out-dir build/image-perf-v2-fixtures --receipt artifacts/ci-image-v2/perf-functional.json
      - name: Verify image pressure, budget and async close (Linux)
        if: runner.os == 'Linux'
        run: LD_LIBRARY_PATH=$PWD/install/host/lib python3 tools/verify_image_pressure.py --image-exe build/image/mgmem_image_pressure_stability --out-dir build/image-pressure-fixtures --receipt artifacts/ci-image-pressure/receipt.json --cycles 4
      - name: Verify image pressure, budget and async close (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/verify_image_pressure.py --image-exe build/image/Release/mgmem_image_pressure_stability.exe --runtime-dir install/host/bin --out-dir build/image-pressure-fixtures --receipt artifacts/ci-image-pressure/receipt.json --cycles 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-installed-${{ matrix.os }}
          path: |
            install/host
            artifacts/ci-image
            artifacts/ci-image-v2
            artifacts/ci-research
            artifacts/ci-packed
            artifacts/ci-pressure
            artifacts/ci-image-pressure
            build/core/Testing/Temporary/LastTest.log
            build/capture-journal-ci/regression-receipt.json
