name: Linux host engineering candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact lowercase 40-character repository commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate requested commit format
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          python3 - <<'PY'
          import os, re
          commit = os.environ.get('REQUESTED_COMMIT', '')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('A complete lowercase 40-character commit is required')
          if commit != os.environ.get('GITHUB_SHA'):
              raise SystemExit('The selected workflow ref must point at the requested commit')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify runner safety contracts
        run: python3 tools/test_run_linux_host_candidate_ci.py
      - name: Build and independently inspect Linux candidate
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
        run: python3 tools/run_linux_host_candidate_ci.py --commit "$REQUESTED_COMMIT"
      - name: Retain scoped engineering candidate and sanitized receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meguvizmemory-linux-host-${{ inputs.commit_sha }}
          path: |
            build/linux-host-candidate-ci/export/MeguvizMemory-Linux-Host-Candidate.tar.gz
            build/linux-host-candidate-ci/export/receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
